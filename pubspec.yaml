name: lcc_gradetrack
description: "LCC GradeTrack: grade and GWA tracker for Legacy College of Compostela students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Data (local only)
  sqflite: ^2.4.6
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.0

  # State + navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # UI
  fl_chart: ^1.3.1
  intl: ^0.20.2

  # Security, reminders, files
  local_auth: ^3.0.2
  crypto: ^3.0.8
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  file_picker: ^13.4.0
  share_plus: ^13.3.1

  # Export + app info
  pdf: ^3.13.1
  printing: ^5.15.1
  csv: ^8.0.0
  package_info_plus: ^10.2.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/brand/lcc_logo.png
    - assets/brand/lcc_logo_512.png
    - assets/fonts/SchibstedGrotesk-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
    - assets/fonts/Phosphor-LICENSE.txt

  fonts:
    - family: Schibsted
      fonts:
        - asset: assets/fonts/SchibstedGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SchibstedGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SchibstedGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SchibstedGrotesk-Bold.ttf
          weight: 700
        - asset: assets/fonts/SchibstedGrotesk-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    # Phosphor icons (MIT). See lib/core/theme/icons.dart.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/brand/icon_legacy.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/icon_fg.png"
  adaptive_icon_monochrome: "assets/brand/icon_mono.png"

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F6F5F1"
  image: assets/brand/lcc_logo_512.png
  color_dark: "#0B0D10"
  image_dark: assets/brand/lcc_logo_512.png
  android_12:
    image: assets/brand/splash_icon.png
    color: "#F6F5F1"
    image_dark: assets/brand/splash_icon.png
    color_dark: "#0B0D10"
  ios: false
  web: false
